location = /arctos-reciprocal-relationship-portal {
    return 301 /arctos-reciprocal-relationship-portal/;
}

location /arctos-reciprocal-relationship-portal/ {
    # Trailing slash strips /arctos-rrp/ before forwarding; uvicorn's --root-path adds it back for URL generation
    proxy_pass http://warbler:8002/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}