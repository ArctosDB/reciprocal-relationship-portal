[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
    "explicit-override",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
line-length = 127

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # docstrings everywhere
    "COM812",  # conflicts with ruff format
    "CPY",     # copyright headers
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]  # assert and magic numbers are normal in tests

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["duckdb: tests need data/arctos.duckdb (skipped if absent)"]

[project]
name = "vulpes"
version = "0.1.0"
requires-python = ">=3.13.5"
dependencies = [
    "duckdb>=2.0.0",
    "elasticsearch>=9.5.1",
    "fastapi>=0.162.2",
    "opentelemetry-distro>=0.66b2",
    "opentelemetry-exporter-otlp>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "pydantic>=2.14.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "ansible-core>=2.22.0",
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
